  <!-- Detecção e aplicação imediata de tema (Zero Flash / FOUC) -->
  <script>
    (function() {
      try {
        var saved = null;
        try { saved = localStorage.getItem('opencnpj_theme'); } catch(e) {}
        if (!saved) {
          var match = document.cookie.match(/(?:^|; )opencnpj_theme=([^;]*)/);
          if (match) saved = match[1];
        }
        var isDark;
        if (saved === 'dark') {
          isDark = true;
        } else if (saved === 'light') {
          isDark = false;
        } else {
          // Padrão: preferência do navegador do usuário
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        var root = document.documentElement;
        if (isDark) {
          root.classList.remove('light-theme');
          root.classList.add('dark-theme');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.add('light-theme');
          root.classList.remove('dark-theme');
          root.style.colorScheme = 'light';
        }

        var meta = document.getElementById('meta-theme-color');
        if (meta) {
          meta.setAttribute('content', isDark ? '#0A101C' : '#F8FAFC');
        }
      } catch(e) {}
    })();
  </script>
